<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>random chord generator - Pure Data</title>

  <!-- Inline Data-URI Favicon (Prevents 404 Console Errors on GitHub Pages) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23e1e1e1%22 stroke=%22%23000%22 stroke-width=%2210%22/><circle cx=%2250%22 cy=%2250%22 r=%2230%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%228%22/></svg>">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    body {
      background-color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      /* Prevent mobile rubber-band scrolling */
      overscroll-behavior: none;
    }

    /* Modal for Web Audio Autoplay Unlock */
    #audio-unlock-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      touch-action: none;
    }

    .unlock-btn {
      background: #e1e1e1;
      border: 2px solid #000;
      padding: 20px 30px;
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 4px 4px 0px #000;
      touch-action: manipulation;
    }

    .unlock-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    /* Pure Data Canvas Container */
    .pd-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pd-title {
      font-size: 14px;
      color: #000;
      padding-left: 28px;
      white-space: nowrap;
    }

    .pd-canvas {
      background-color: #e1e1e1;
      border: 1px solid #000;
      padding: 30px 20px 25px 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      transition: background-color 0.12s ease-out;
    }

    .pd-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Pure Data Bang Button (bng) */
    .pd-bng {
      width: 48px;
      height: 48px;
      background-color: #ffffff;
      border: 1px solid #000;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .pd-bng::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border: 1px solid #000;
      border-radius: 50%;
      background-color: transparent;
      transition: background-color 0.05s ease;
    }

    .pd-bng.active::after {
      background-color: #000000;
    }

    /* Vertical Radio Box Array (vradio) */
    .pd-vradio-container {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .pd-vradio-option {
      width: 48px;
      height: 48px;
      background-color: #ffffff;
      border: 1px solid #000;
      margin-top: -1px;
      position: relative;
      cursor: pointer;
      touch-action: manipulation;
    }

    .pd-vradio-option:first-child {
      margin-top: 0;
    }

    .pd-vradio-option.selected::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      background-color: #000000;
    }

    .pd-radio-labels {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      height: 95px;
    }

    /* Toggle Box (tgl) */
    .pd-tgl {
      width: 48px;
      height: 48px;
      background-color: #ffffff;
      border: 1px solid #000;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .pd-tgl.active {
      background-color: #ff8500; /* Pure Data orange */
    }

    .pd-tgl.active::before,
    .pd-tgl.active::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 1px;
      background-color: #000;
    }

    .pd-tgl.active::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .pd-tgl.active::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    /* Horizontal Slider (hsl) */
    .pd-hsl-container {
      width: 100%;
      height: 42px;
      background-color: #ffffff;
      border: 1px solid #000;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Crucial for iOS/Android smooth dragging without page scroll */
      touch-action: none;
    }

    .pd-hsl-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background-color: #000000;
      left: 0%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .pd-hsl-label {
      font-size: 13px;
      color: #000;
      pointer-events: none;
      z-index: 1;
    }

    .pd-label {
      font-size: 13px;
      color: #000;
    }

    .pd-footer {
      text-align: right;
      font-size: 13px;
      color: #000;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Web Audio Unlock Overlay -->
  <div id="audio-unlock-overlay">
    <button class="unlock-btn" id="unlock-btn">Click to Start Audio Engine</button>
  </div>

  <!-- Pure Data Canvas UI -->
  <div class="pd-container">
    <div class="pd-title">random chord generator</div>
    
    <div class="pd-canvas" id="pd-canvas">
      <!-- Play Button -->
      <div class="pd-row">
        <div class="pd-bng" id="bng-chord"></div>
        <div class="pd-label">play a random chord</div>
      </div>

      <!-- Stop Button -->
      <div class="pd-row">
        <div class="pd-bng" id="bng-stop"></div>
        <div class="pd-label">stop the sound</div>
      </div>

      <!-- Complex / Simple Radio Array -->
      <div class="pd-row" style="align-items: stretch;">
        <div class="pd-vradio-container">
          <div class="pd-vradio-option" id="radio-complex" data-value="complex"></div>
          <div class="pd-vradio-option selected" id="radio-simple" data-value="simple"></div>
        </div>
        <div class="pd-radio-labels">
          <div class="pd-label">complex chords</div>
          <div class="pd-label">simple chords</div>
        </div>
      </div>

      <!-- Auto Mode Toggle -->
      <div class="pd-row">
        <div class="pd-tgl" id="tgl-auto"></div>
        <div class="pd-label">auto mode</div>
      </div>

      <!-- Chord Length Slider -->
      <div class="pd-hsl-container" id="hsl-length">
        <div class="pd-hsl-indicator" id="hsl-indicator"></div>
        <span class="pd-hsl-label">chord length</span>
      </div>
    </div>

    <div class="pd-footer">nick syman 2024</div>
  </div>

  <script>
    // --- Web Audio Engine & Patch Logic ---
    let audioCtx = null;
    let masterGain = null;
    let limiterNode = null; // Soft-clipping safety limiter
    let isAudioInitialized = false;

    // Sustained synth voice structure
    const NUM_VOICES = 5;
    let voiceOscillators = [];
    let voiceGains = [];
    let filterNode = null; // Single Resonant Low-Pass Filter
    let chorusDelayLeft = null;
    let chorusDelayRight = null;
    let chorusLfo1 = null;
    let chorusLfo2 = null;

    // Control state
    let chordMode = 'simple'; // 'simple' or 'complex'
    let autoMode = false;
    let chordLengthMs = 2000; // 2000 ms default
    let autoTimer = null;
    let isPlaying = false;

    // Default Canvas Grey Color
    const DEFAULT_CANVAS_GREY = '#e1e1e1';

    function initAudio() {
      if (isAudioInitialized) return;

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();

      // Master Gain Stage
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.0, audioCtx.currentTime);

      // Soft Clipping Safety Limiter Stage
      limiterNode = audioCtx.createDynamicsCompressor();
      limiterNode.threshold.setValueAtTime(-0.5, audioCtx.currentTime); // Ceiling just below 0 dBFS
      limiterNode.knee.setValueAtTime(0.0, audioCtx.currentTime);        // Hard knee for brickwall protection
      limiterNode.ratio.setValueAtTime(20.0, audioCtx.currentTime);      // Max limiting ratio
      limiterNode.attack.setValueAtTime(0.003, audioCtx.currentTime);    // Fast attack (3ms)
      limiterNode.release.setValueAtTime(0.1, audioCtx.currentTime);     // Smooth release (100ms)

      // Single Resonant Low-Pass Filter
      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'lowpass';
      filterNode.frequency.setValueAtTime(300, audioCtx.currentTime);
      filterNode.Q.setValueAtTime(1.0, audioCtx.currentTime);

      // Simple Chorus Subpatch Implementation
      chorusDelayLeft = audioCtx.createDelay(0.1);
      chorusDelayRight = audioCtx.createDelay(0.1);
      chorusDelayLeft.delayTime.setValueAtTime(0.015, audioCtx.currentTime);
      chorusDelayRight.delayTime.setValueAtTime(0.020, audioCtx.currentTime);

      // Chorus LFOs
      chorusLfo1 = audioCtx.createOscillator();
      chorusLfo2 = audioCtx.createOscillator();
      chorusLfo1.frequency.setValueAtTime(0.5, audioCtx.currentTime);
      chorusLfo2.frequency.setValueAtTime(0.4, audioCtx.currentTime);

      const lfoGain1 = audioCtx.createGain();
      const lfoGain2 = audioCtx.createGain();
      lfoGain1.gain.setValueAtTime(0.003, audioCtx.currentTime);
      lfoGain2.gain.setValueAtTime(0.003, audioCtx.currentTime);

      chorusLfo1.connect(lfoGain1);
      lfoGain1.connect(chorusDelayLeft.delayTime);
      chorusLfo2.connect(lfoGain2);
      lfoGain2.connect(chorusDelayRight.delayTime);

      chorusLfo1.start();
      chorusLfo2.start();

      // Stereo Merger for Chorus
      const merger = audioCtx.createChannelMerger(2);

      // Voice Creation (5 Sawtooth Oscillators)
      for (let i = 0; i < NUM_VOICES; i++) {
        const osc = audioCtx.createOscillator();
        const vGain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);

        const defaultWeight = (i === 0) ? 0.40 : 0.25;
        vGain.gain.setValueAtTime(defaultWeight, audioCtx.currentTime);

        osc.connect(vGain);
        vGain.connect(filterNode);

        osc.start();
        voiceOscillators.push(osc);
        voiceGains.push(vGain);
      }

      // Voice Routing: Voices -> Low-Pass Filter -> Chorus -> Master Gain -> Limiter -> Output
      filterNode.connect(chorusDelayLeft);
      filterNode.connect(chorusDelayRight);

      chorusDelayLeft.connect(merger, 0, 0);
      chorusDelayRight.connect(merger, 0, 1);

      merger.connect(masterGain);
      masterGain.connect(limiterNode);
      limiterNode.connect(audioCtx.destination);

      isAudioInitialized = true;
    }

    // iOS Hardware Silent Switch Bypass
    function forceUnmuteIOS() {
      if (!audioCtx) return;
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);
    }

    // Helper: MIDI to Frequency
    function mtof(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    // 1. Simple Chord Generation Logic
    function generateSimpleChord() {
      const minRoot = 45; 
      const maxRoot = 64;
      const root = Math.floor(Math.random() * (maxRoot - minRoot + 1)) + minRoot;

      const third = Math.random() < 0.5 ? 3 : 4;   // 3 = Minor, 4 = Major
      const fifth = 7;                              
      const seventh = Math.random() < 0.5 ? 10 : 11; // 10 = Minor 7th, 11 = Major 7th

      return [
        root - 12,     // Sub-bass voice
        root,          
        root + third,  
        root + fifth,  
        root + seventh 
      ];
    }

    // 2. Complex Chord Generation Logic
    function generateComplexChord() {
      const minRoot = 45;
      const maxRoot = 62;
      const root = Math.floor(Math.random() * (maxRoot - minRoot + 1)) + minRoot;
      const stepOffset = Math.floor(Math.random() * 3) + 2; 

      return [
        root - 12,
        root + stepOffset,
        root + stepOffset * 2 + 1,
        root + stepOffset * 3 + 3,
        root + stepOffset * 4 + 5
      ];
    }

    // --- Custom Color Calculation Function ---
    function computeCanvasColor(chordMidi, targetCutoff, targetQ) {
      const rootMidi = chordMidi[1]; // Root pitch class
      const pitchClass = rootMidi % 12;

      // 1. Root = Hue (Direct 1-to-1 chromatic mapping across 360 degrees)
      const hue = pitchClass * 30; // 0 deg = C, 30 deg = C#, ..., 330 deg = B

      // 2. Lightness & Saturation Setup
      let baseLightness = 80;
      let saturation = 20;
      const bassFreq = mtof(chordMidi[0]);

      if (chordMode === 'simple') {
        const third = chordMidi[2] - rootMidi;   // 3 = Minor, 4 = Major
        const seventh = chordMidi[4] - rootMidi; // 10 = Minor 7th, 11 = Major 7th

        // Expanded Lightness Range for Simple Mode (48% to 88%)
        if (third === 3 && seventh === 10) baseLightness = 48;      // m7 (Deep/Darkest)
        else if (third === 3 && seventh === 11) baseLightness = 58; // m(maj7)
        else if (third === 4 && seventh === 10) baseLightness = 74; // Dom7
        else if (third === 4 && seventh === 11) baseLightness = 86; // maj7 (Very Light)

        // Lightness Boost from Filter Cutoff (+0% to +10%)
        const cutoffRatio = Math.min(8.5, Math.max(2.5, targetCutoff / bassFreq)); 
        const cutoffLightnessBoost = ((cutoffRatio - 2.5) / 6.0) * 10;
        baseLightness = Math.min(92, Math.max(45, baseLightness + cutoffLightnessBoost));

        // Expanded Saturation Range for Simple Mode (30% to 85%)
        const qNormalized = Math.min(1, Math.max(0, (targetQ - 0.1) / 9.9));
        saturation = 30 + qNormalized * 55;

      } else {
        // --- Complex Mode (Wider & Maxed Ranges) ---
        const minNote = chordMidi[0];
        const maxNote = chordMidi[chordMidi.length - 1];
        const semitoneSpan = maxNote - minNote; // Range (e.g., 20 to 45 semitones)

        // Maximized Lightness Range for Complex Mode (32% to 88%)
        const spanNormalized = Math.min(1, Math.max(0, (semitoneSpan - 20) / 25));
        baseLightness = 32 + spanNormalized * 56;

        // Cutoff Modulation (+0% to +12% lightness)
        const cutoffRatio = Math.min(8.5, Math.max(2.5, targetCutoff / bassFreq));
        const cutoffLightnessBoost = ((cutoffRatio - 2.5) / 6.0) * 12;
        baseLightness = Math.min(94, Math.max(30, baseLightness + cutoffLightnessBoost));

        // Maximized Saturation Range for Complex Mode (35% to 100%)
        const qNormalized = Math.min(1, Math.max(0, (targetQ - 0.1) / 9.9));
        saturation = 35 + qNormalized * 40; // Base from Q (35% to 75%)

        // Small interval clusters add +12% saturation each
        let smallIntervalCount = 0;
        for (let i = 1; i < chordMidi.length - 1; i++) {
          if (chordMidi[i + 1] - chordMidi[i] <= 3) {
            smallIntervalCount++;
          }
        }
        saturation += smallIntervalCount * 12; // Spike saturation up to 100%
      }

      const finalLightness = Math.min(94, Math.max(30, baseLightness));
      const finalSaturation = Math.min(100, Math.max(20, saturation));

      return `hsl(${hue.toFixed(1)}, ${finalSaturation.toFixed(1)}%, ${finalLightness.toFixed(1)}%)`;
    }

    // Play Chord Action
    function playChord() {
      if (!isAudioInitialized) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;
      const transitionDuration = 0.08; 

      // Random Filter Sweep Time independent of Chord Length (between 1.0s and 6.0s)
      const filterSweepDuration = 1.0 + Math.random() * 5.0;

      // Get chord array
      const chordMidi = (chordMode === 'simple') ? generateSimpleChord() : generateComplexChord();

      // Update Oscillators (with safe non-zero positive frequency bounds)
      for (let i = 0; i < NUM_VOICES; i++) {
        const freq = Math.max(20, mtof(chordMidi[i]));
        voiceOscillators[i].frequency.cancelScheduledValues(now);
        voiceOscillators[i].frequency.setValueAtTime(Math.max(20, voiceOscillators[i].frequency.value), now);
        voiceOscillators[i].frequency.exponentialRampToValueAtTime(freq, now + transitionDuration);
      }

      // Continuous Floating-Point Cutoff Multiplier Range (2.5x to 8.5x Bass Frequency)
      const bassFreq = mtof(chordMidi[0]);
      const cutoffMultiplier = 2.5 + Math.random() * 6.0; 
      const targetCutoff = bassFreq * cutoffMultiplier;

      // Resonance Range: 0.1 to 10.0
      const targetQ = 0.1 + Math.random() * 9.9;

      // Apply filter ramp over the random 1–6s sweep time
      filterNode.frequency.cancelScheduledValues(now);
      filterNode.frequency.setValueAtTime(filterNode.frequency.value, now);
      filterNode.frequency.linearRampToValueAtTime(targetCutoff, now + filterSweepDuration);

      filterNode.Q.cancelScheduledValues(now);
      filterNode.Q.setValueAtTime(filterNode.Q.value, now);
      filterNode.Q.linearRampToValueAtTime(targetQ, now + filterSweepDuration);

      // Open Master Gain (+6 dB Boost)
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(0.70, now + 0.1);

      // Update UI Background Color
      const canvasElem = document.getElementById('pd-canvas');
      canvasElem.style.backgroundColor = computeCanvasColor(chordMidi, targetCutoff, targetQ);

      isPlaying = true;
    }

    // Stop Sound Action
    function stopSound() {
      if (!isAudioInitialized) return;
      const now = audioCtx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(0.0, now + 0.15);

      // Revert UI Canvas back to default grey
      const canvasElem = document.getElementById('pd-canvas');
      canvasElem.style.backgroundColor = DEFAULT_CANVAS_GREY;

      isPlaying = false;
    }

    // Auto Mode Timer Logic
    function syncAutoTimer() {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }
      if (autoMode) {
        playChord();
        autoTimer = setInterval(() => {
          if (autoMode) playChord();
        }, chordLengthMs);
      } else {
        stopSound();
      }
    }

    // Auto-Resume on Page Visibility Change (Tab focus / Screen unlock)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    // --- UI Interactions ---
    const unlockOverlay = document.getElementById('audio-unlock-overlay');
    const unlockBtn = document.getElementById('unlock-btn');
    const bngChord = document.getElementById('bng-chord');
    const bngStop = document.getElementById('bng-stop');
    const radioSimple = document.getElementById('radio-simple');
    const radioComplex = document.getElementById('radio-complex');
    const tglAuto = document.getElementById('tgl-auto');
    const hslLength = document.getElementById('hsl-length');
    const hslIndicator = document.getElementById('hsl-indicator');

    unlockBtn.addEventListener('click', () => {
      initAudio();
      forceUnmuteIOS();
      audioCtx.resume();
      unlockOverlay.style.display = 'none';
    });

    function triggerBng(element) {
      element.classList.add('active');
      setTimeout(() => element.classList.remove('active'), 120);
    }

    bngChord.addEventListener('click', () => {
      triggerBng(bngChord);
      playChord();
    });

    bngStop.addEventListener('click', () => {
      triggerBng(bngStop);
      stopSound();
    });

    function setChordMode(mode) {
      chordMode = mode;
      if (mode === 'simple') {
        radioSimple.classList.add('selected');
        radioComplex.classList.remove('selected');
      } else {
        radioComplex.classList.add('selected');
        radioSimple.classList.remove('selected');
      }
    }

    radioSimple.addEventListener('click', () => setChordMode('simple'));
    radioComplex.addEventListener('click', () => setChordMode('complex'));

    tglAuto.addEventListener('click', () => {
      autoMode = !autoMode;
      if (autoMode) {
        tglAuto.classList.add('active');
      } else {
        tglAuto.classList.remove('active');
      }
      syncAutoTimer();
    });

    // --- Universal Slider Interaction via Pointer Events ---
    let isDraggingSlider = false;

    function updateSliderPosition(pointerX) {
      const rect = hslLength.getBoundingClientRect();
      let offsetX = pointerX - rect.left;
      offsetX = Math.max(0, Math.min(offsetX, rect.width));

      const percentage = offsetX / rect.width;
      hslIndicator.style.left = `${percentage * 100}%`;

      chordLengthMs = 2000 + percentage * (20000 - 2000);

      if (autoMode) {
        syncAutoTimer();
      }
    }

    hslLength.addEventListener('pointerdown', (e) => {
      isDraggingSlider = true;
      hslLength.setPointerCapture(e.pointerId);
      updateSliderPosition(e.clientX);
    });

    hslLength.addEventListener('pointermove', (e) => {
      if (isDraggingSlider) {
        updateSliderPosition(e.clientX);
      }
    });

    hslLength.addEventListener('pointerup', (e) => {
      if (isDraggingSlider) {
        isDraggingSlider = false;
        hslLength.releasePointerCapture(e.pointerId);
      }
    });

    hslLength.addEventListener('pointercancel', (e) => {
      isDraggingSlider = false;
    });
  </script>
</body>
</html>
